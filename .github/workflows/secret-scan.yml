name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the open-source gitleaks CLI (MIT) via its official image. Unlike
      # gitleaks-action@v2, the CLI needs no license on organization repos.
      # `detect` scans the full git history; non-zero exit fails the job.
      - name: Run gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --redact --verbose --exit-code 1
