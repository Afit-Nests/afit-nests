[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the static app. The Express/helmet policy only covers API
# responses (a different origin); the HTML/JS bundle served here needs its own.
#
# IMPORTANT: replace API_ORIGIN in connect-src below with the real backend origin
# (the host part of VITE_API_BASE_URL, e.g. https://afit-nests-api.onrender.com).
# If it does not match, the browser will block every API call and the app will
# appear broken. img-src stays broad (https:) because listing photos are remote.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://js.paystack.co; frame-src 'self' https://checkout.paystack.com https://*.paystack.co; connect-src 'self' https://api.paystack.co API_ORIGIN; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"

